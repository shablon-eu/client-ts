name: Release Notes

on:
  release:
    types: [published]

jobs:
  update-release:
    name: Update Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev-tag
        run: echo "tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sed -n '2p')" >> "$GITHUB_OUTPUT"

      - name: Generate changelog and update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG="${{ steps.prev-tag.outputs.tag }}"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${{ github.event.release.tag_name }}"
          else
            RANGE="${{ github.event.release.tag_name }}"
          fi
          CHANGELOG=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges)
          gh release edit "${{ github.event.release.tag_name }}" --notes "$CHANGELOG"
